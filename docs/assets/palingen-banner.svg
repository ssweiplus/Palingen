<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Palingen — Agentification for Existing Software</title>
  <desc id="desc">A dark banner illustrating semantic uncertainty rising to the Agent and execution truth settling into the Harness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.52" stop-color="#111a33"/>
      <stop offset="1" stop-color="#17122d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#72d6c9"/>
      <stop offset="1" stop-color="#e8b86a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#9eb1d8" fill="none">
    <path d="M0 292 C220 248 392 324 602 280 S990 238 1200 292"/>
    <path d="M0 315 C210 278 390 340 610 305 S985 270 1200 320"/>
    <path d="M0 70 C220 110 390 48 600 84 S995 116 1200 62"/>
  </g>

  <g transform="translate(86 54)">
    <circle cx="118" cy="126" r="88" fill="none" stroke="#34456f" stroke-width="2"/>
    <circle cx="118" cy="126" r="64" fill="none" stroke="#4d5f88" stroke-width="2"/>
    <path d="M118 204 L118 52" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M105 69 L118 50 L131 69" fill="none" stroke="#e8b86a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M105 186 L118 205 L131 186" fill="none" stroke="#72d6c9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="126" r="13" fill="#f1f5ff"/>
    <circle cx="118" cy="126" r="6" fill="#111a33"/>
    <text x="118" y="27" text-anchor="middle" fill="#e8b86a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2">SEMANTIC</text>
    <text x="118" y="239" text-anchor="middle" fill="#72d6c9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="2">TRUTH</text>
  </g>

  <g transform="translate(350 74)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="0" y="56" fill="#f6f7fb" font-size="72" font-weight="700" letter-spacing="5">PALINGEN</text>
    <text x="2" y="98" fill="#c4cce0" font-size="24">Agentification for Existing Software</text>
    <text x="2" y="141" fill="#e8b86a" font-size="18">Move semantic uncertainty upward. Move execution truth downward.</text>
    <text x="2" y="173" fill="#72d6c9" font-size="18">让语义不确定性上浮，让执行真相下沉。</text>
    <line x1="2" y1="202" x2="720" y2="202" stroke="#33405f"/>
    <text x="2" y="235" fill="#9ca8c4" font-size="16" font-style="italic">Solve et coagula — dissolve the old control structure, recombine around responsibility.</text>
  </g>
</svg>